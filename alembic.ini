[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# L'URL reelle est injectee par alembic/env.py depuis
# ferry_agent.config.get_settings() (DATABASE_URL). Cette valeur n'est
# utilisee que si env.py ne parvient pas a importer la config applicative.
sqlalchemy.url = postgresql+asyncpg://ferry:ferry@localhost:5432/ferry_agent

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
