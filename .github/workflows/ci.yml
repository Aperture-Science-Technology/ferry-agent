name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ferry
          POSTGRES_PASSWORD: ferry
          POSTGRES_DB: ferry_test
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://ferry:ferry@localhost:5432/ferry_test
        run: pytest -q

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://ferry:ferry@localhost:5432/ferry_test
        run: pytest tests/integration -q

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
