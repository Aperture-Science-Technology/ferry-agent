name: Secrets

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@latest

      - name: Scan full git history for secrets
        # --redact: never echo raw secrets in CI logs
        # --log-opts="--all": every ref/commit, not just the PR tip
        # Historical Clerk keyless claimToken is allowlisted in .gitleaks.toml
        # (revoked out-of-band); remove that allowlist entry after Clerk revocation.
        run: gitleaks detect --redact --source . --log-opts="--all"
