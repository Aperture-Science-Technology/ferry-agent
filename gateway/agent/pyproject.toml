[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ferry-gateway-agent"
version = "0.1.0"
description = "Detached Ferry Agent gateway for Prowlarr and Transmission"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "pydantic-settings>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
ferry-gateway-agent = "ferry_gateway_agent.worker:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ferry_gateway_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
