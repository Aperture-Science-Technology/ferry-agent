[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
silent=false

; Start order: transmission, then Prowlarr. The agent wrapper waits until
; both HTTP endpoints answer before exec'ing ferry-gateway-agent.
; Processes drop to APP_USER (PUID/PGID). supervisord stays root so it can
; attach child logs to the container stdout.

[program:transmission]
command=/usr/bin/transmission-daemon -f --config-dir /config/transmission
user=%(ENV_APP_USER)s
directory=/config/transmission
priority=100
autostart=true
autorestart=true
startsecs=2
startretries=10
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:prowlarr]
command=/opt/Prowlarr/Prowlarr -nobrowser -data=/config/prowlarr
user=%(ENV_APP_USER)s
directory=/opt/Prowlarr
priority=200
autostart=true
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=20
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gateway-agent]
command=/usr/local/bin/run-gateway-agent.sh
directory=/opt/gateway-agent
user=%(ENV_APP_USER)s
priority=300
autostart=true
autorestart=true
startsecs=3
startretries=30
stopwaitsecs=15
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
