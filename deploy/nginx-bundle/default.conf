# Service des artefacts gateway servis sous /bundle (nginx:alpine).
#
# Pourquoi ce fichier existe : sans en-tête `Cache-Control` explicite, Cloudflare
# applique son TTL par défaut de 4 heures aux objets non-HTML. Les archives
# gateway portent un nom STABLE et sont remplacées EN PLACE à chaque release :
# le CDN servait donc encore l'ancienne image après une publication.
# Constaté en production le 2026-10-07 : l'archive arm64 était servie en
# `cf-cache-status: HIT` avec `last-modified` de la release précédente,
# 187 362 816 octets au lieu de 183 413 248, pendant près de deux heures.
#
# Règle retenue : les grosses archives sont cachées 5 minutes (une revalidation
# rapide suffit à propager une release, tout en gardant le bénéfice du CDN pour
# des téléchargements de ~200 Mo) ; les textes et sommes ne sont jamais mis en
# cache, parce qu'ils doivent toujours refléter la release courante.

server {
    listen 80;
    server_name _;
    # Traefik ne retire PAS le préfixe `/bundle` : la racine doit rester le
    # dossier parent, sinon `/bundle/xxx.tar` se résout en
    # /usr/share/nginx/html/bundle/bundle/xxx.tar et renvoie 404.
    # (Vérifié à l'origine après application : 404 Not Found.)
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.tar$ {
        add_header Cache-Control "public, max-age=300" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
}
