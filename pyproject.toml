[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ferry-agent"
version = "0.1.0"
description = "Ferry Agent - pont ebooks multi-liseuses (core backend)"
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Option 2 : on laisse testpaths sur le core. L'execution des tests
# mcp-server/tests est traitee dans W-10 (ne pas melanger les perimetres).
testpaths = ["tests"]

# line-length measured max Python line = 120 (cloud_links.py / 0009_fk_ondelete.py);
# set to 120 to avoid mass reformatting in this PR.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
