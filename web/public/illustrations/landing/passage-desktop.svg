<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none" role="presentation">
  <!-- Original Ferry Agent landing scene (desktop 8:5). No third-party assets. -->
  <defs>
    <linearGradient id="fa-desk-shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F8F4EE"/>
      <stop offset="100%" stop-color="#EDE6DC"/>
    </linearGradient>
    <linearGradient id="fa-desk-wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3EEE6"/>
      <stop offset="100%" stop-color="#E6DDD2"/>
    </linearGradient>
    <filter id="fa-desk-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#3D342C" flood-opacity=".14"/>
    </filter>
    <filter id="fa-desk-book" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#3D342C" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Soft ground plane -->
  <ellipse cx="400" cy="458" rx="340" ry="22" fill="#E4DDD3" fill-opacity=".85"/>

  <!-- Online library (matte panel with depth) -->
  <g filter="url(#fa-desk-soft)">
    <rect x="36" y="70" width="220" height="300" rx="6" fill="url(#fa-desk-wall)" stroke="#C9BFAF" stroke-width="1.25"/>
    <rect x="48" y="84" width="196" height="16" rx="2" fill="#D8CFC2" fill-opacity=".7"/>
    <!-- shelf rails -->
    <rect x="52" y="178" width="188" height="5" rx="1" fill="#C2B6A6"/>
    <rect x="52" y="268" width="188" height="5" rx="1" fill="#C2B6A6"/>
    <rect x="52" y="348" width="188" height="5" rx="1" fill="#C2B6A6"/>
    <!-- anonymous shelf books (matte spines) -->
    <rect x="60" y="118" width="18" height="56" rx="2" fill="#6E5844"/>
    <rect x="84" y="126" width="14" height="48" rx="2" fill="#8A7360"/>
    <rect x="104" y="114" width="16" height="60" rx="2" fill="#5C4A3A"/>
    <rect x="126" y="122" width="15" height="52" rx="2" fill="#7A6550"/>
    <rect x="148" y="116" width="17" height="58" rx="2" fill="#4F4034"/>
    <rect x="172" y="128" width="13" height="46" rx="2" fill="#9A8570"/>
    <rect x="192" y="120" width="16" height="54" rx="2" fill="#6B5340"/>
    <rect x="60" y="204" width="16" height="58" rx="2" fill="#8B6B4A"/>
    <rect x="82" y="212" width="14" height="50" rx="2" fill="#5C4A3A"/>
    <rect x="102" y="208" width="15" height="54" rx="2" fill="#7A6550"/>
    <!-- Demo book on shelf - same cover identity as travel + reader -->
    <g filter="url(#fa-desk-book)">
      <rect x="128" y="198" width="46" height="66" rx="3" fill="#F3EBE1" stroke="#BFAE98" stroke-width="1.2"/>
      <rect x="128" y="198" width="7" height="66" rx="2" fill="#A36B3A"/>
      <rect x="142" y="214" width="24" height="4" rx="1" fill="#8B7355" fill-opacity=".55"/>
      <rect x="142" y="224" width="18" height="3" rx="1" fill="#8B7355" fill-opacity=".35"/>
      <!-- Ferry arc mark on cover -->
      <path d="M146 242 C154 232, 164 232, 172 242" stroke="#A36B3A" stroke-width="2" stroke-linecap="round" fill="none"/>
      <circle cx="146" cy="242" r="2" fill="#A36B3A"/>
      <circle cx="172" cy="242" r="2" fill="#A36B3A"/>
    </g>
    <rect x="184" y="210" width="14" height="52" rx="2" fill="#6E5844"/>
    <rect x="204" y="206" width="16" height="56" rx="2" fill="#9A7B55"/>
    <rect x="60" y="292" width="18" height="50" rx="2" fill="#5C4A3A"/>
    <rect x="84" y="298" width="15" height="44" rx="2" fill="#8A7360"/>
    <rect x="106" y="290" width="16" height="52" rx="2" fill="#6B5340"/>
    <rect x="130" y="296" width="14" height="46" rx="2" fill="#7A6550"/>
    <rect x="152" y="288" width="17" height="54" rx="2" fill="#4F4034"/>
    <rect x="176" y="294" width="14" height="48" rx="2" fill="#9A8570"/>
    <rect x="198" y="300" width="16" height="42" rx="2" fill="#6E5844"/>
  </g>

  <!-- Generic e-reader -->
  <g filter="url(#fa-desk-soft)">
    <rect x="548" y="96" width="200" height="278" rx="18" fill="#2A2723" stroke="#1A1816" stroke-width="2"/>
    <rect x="568" y="118" width="160" height="210" rx="4" fill="#E9E4DA"/>
    <!-- Same demo cover on screen -->
    <g>
      <rect x="598" y="148" width="100" height="140" rx="4" fill="#F3EBE1" stroke="#BFAE98" stroke-width="1.1"/>
      <rect x="598" y="148" width="10" height="140" rx="2" fill="#A36B3A"/>
      <rect x="620" y="178" width="56" height="5" rx="1.5" fill="#8B7355" fill-opacity=".5"/>
      <rect x="620" y="192" width="44" height="4" rx="1" fill="#8B7355" fill-opacity=".32"/>
      <path d="M622 236 C640 218, 658 218, 676 236" stroke="#A36B3A" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <circle cx="622" cy="236" r="2.2" fill="#A36B3A"/>
      <circle cx="676" cy="236" r="2.2" fill="#A36B3A"/>
    </g>
    <circle cx="648" cy="350" r="7" fill="#4A4540"/>
  </g>

  <!-- Ferry passage arc (decorative link, not a flowchart) -->
  <path
    d="M256 230 C320 150, 420 140, 548 220"
    stroke="#A36B3A"
    stroke-width="2.4"
    stroke-linecap="round"
    fill="none"
    stroke-opacity=".88"
  />
  <circle cx="256" cy="230" r="3.4" fill="#A36B3A"/>
  <circle cx="548" cy="220" r="3.4" fill="#A36B3A"/>
</svg>
