<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none" role="presentation">
  <!-- Original Ferry Agent landing scene (mobile, near-square). No third-party assets. -->
  <!-- Short passage arc: library to book and book to reader -->
  <defs>
    <linearGradient id="fa-mob-wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3EEE6"/>
      <stop offset="100%" stop-color="#E6DDD2"/>
    </linearGradient>
    <filter id="fa-mob-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#3D342C" flood-opacity=".14"/>
    </filter>
    <filter id="fa-mob-book" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#3D342C" flood-opacity=".18"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="372" rx="168" ry="16" fill="#E4DDD3" fill-opacity=".85"/>

  <!-- Compact library -->
  <g filter="url(#fa-mob-soft)">
    <rect x="28" y="28" width="152" height="168" rx="6" fill="url(#fa-mob-wall)" stroke="#C9BFAF" stroke-width="1.25"/>
    <rect x="40" y="40" width="128" height="12" rx="2" fill="#D8CFC2" fill-opacity=".7"/>
    <rect x="42" y="98" width="124" height="4" rx="1" fill="#C2B6A6"/>
    <rect x="42" y="172" width="124" height="4" rx="1" fill="#C2B6A6"/>
    <rect x="48" y="58" width="14" height="36" rx="2" fill="#6E5844"/>
    <rect x="68" y="64" width="12" height="30" rx="2" fill="#8A7360"/>
    <rect x="86" y="56" width="13" height="38" rx="2" fill="#5C4A3A"/>
    <rect x="106" y="62" width="12" height="32" rx="2" fill="#7A6550"/>
    <rect x="126" y="58" width="14" height="36" rx="2" fill="#4F4034"/>
    <rect x="148" y="66" width="12" height="28" rx="2" fill="#9A8570"/>
    <!-- Demo book on shelf - same cover identity -->
    <g filter="url(#fa-mob-book)">
      <rect x="72" y="112" width="40" height="56" rx="3" fill="#F3EBE1" stroke="#BFAE98" stroke-width="1.1"/>
      <rect x="72" y="112" width="6" height="56" rx="2" fill="#A36B3A"/>
      <rect x="84" y="126" width="20" height="3.5" rx="1" fill="#8B7355" fill-opacity=".55"/>
      <rect x="84" y="134" width="15" height="2.5" rx="1" fill="#8B7355" fill-opacity=".35"/>
      <path d="M86 150 C94 142, 102 142, 110 150" stroke="#A36B3A" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <circle cx="86" cy="150" r="1.8" fill="#A36B3A"/>
      <circle cx="110" cy="150" r="1.8" fill="#A36B3A"/>
    </g>
    <rect x="122" y="120" width="12" height="48" rx="2" fill="#6E5844"/>
    <rect x="140" y="116" width="14" height="52" rx="2" fill="#9A7B55"/>
  </g>

  <!-- Generic e-reader (lower, larger) -->
  <g filter="url(#fa-mob-soft)">
    <rect x="118" y="214" width="164" height="136" rx="14" fill="#2A2723" stroke="#1A1816" stroke-width="2"/>
    <rect x="134" y="228" width="132" height="96" rx="3" fill="#E9E4DA"/>
    <g>
      <rect x="160" y="240" width="80" height="68" rx="3" fill="#F3EBE1" stroke="#BFAE98" stroke-width="1"/>
      <rect x="160" y="240" width="8" height="68" rx="2" fill="#A36B3A"/>
      <rect x="176" y="254" width="44" height="3.5" rx="1" fill="#8B7355" fill-opacity=".5"/>
      <rect x="176" y="264" width="34" height="2.5" rx="1" fill="#8B7355" fill-opacity=".32"/>
      <path d="M178 288 C192 276, 206 276, 220 288" stroke="#A36B3A" stroke-width="1.8" stroke-linecap="round" fill="none"/>
      <circle cx="178" cy="288" r="1.8" fill="#A36B3A"/>
      <circle cx="220" cy="288" r="1.8" fill="#A36B3A"/>
    </g>
    <circle cx="200" cy="338" r="5" fill="#4A4540"/>
  </g>

  <!-- Ferry passage arc -->
  <path
    d="M152 168 C190 120, 250 118, 280 214"
    stroke="#A36B3A"
    stroke-width="2.2"
    stroke-linecap="round"
    fill="none"
    stroke-opacity=".88"
  />
  <circle cx="152" cy="168" r="3" fill="#A36B3A"/>
  <circle cx="280" cy="214" r="3" fill="#A36B3A"/>
</svg>
